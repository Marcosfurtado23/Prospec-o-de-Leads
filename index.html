
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGenius AI Prospector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
                        'sparkle': 'sparkle 1.5s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                            '50%': { opacity: '1', transform: 'scale(1.1)' },
                        },
                        'sparkle': {
                            '0%': { opacity: '0.5', transform: 'scale(0.8)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-morphism {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Tech Animation Styles */
        .tech-ring {
            position: absolute;
            inset: -4px;
            border: 2px dashed #2563eb;
            border-radius: 12px;
            animation: spin 10s linear infinite;
            opacity: 0.5;
        }
        .dark .tech-ring {
            border-color: #60a5fa;
        }
        .tech-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.2) 0%, transparent 70%);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        /* Loading Screen Specific Styles */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a; /* Slate 900 for dark mode */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            transition: opacity 0.5s ease-out;
        }
        .loading-screen .tech-animation-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 2rem;
        }
        .loading-screen .tech-animation-container .tech-ring {
            inset: -8px;
            border-width: 3px;
            border-radius: 20px;
        }
        .loading-screen .tech-animation-container .tech-glow {
            inset: 0;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.3) 0%, transparent 70%);
        }
        .loading-screen .progress-bar-container {
            width: 80%;
            max-width: 400px;
            background-color: #334155; /* Slate 700 */
            border-radius: 9999px;
            height: 8px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .loading-screen .progress-bar-fill {
            height: 100%;
            background-color: #2563eb; /* Blue 600 */
            border-radius: 9999px;
            transition: width 0.1s linear;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "jspdf": "https://esm.sh/jspdf@^2.5.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
